- version: 3.0.0
  date: April 2026
  latest: false
  yanked: false
  summary: 'Maglev 3.0 is a major release. The editor is rebuilt on Hotwire (Turbo
    + Stimulus), ViewComponent, Tailwind CSS 4, and importmap-rails — with no Node.js,
    npm, Yarn, or Vite in the shipping path. That means leaner production images,
    fewer CI steps, and faster deploys without a separate front-end build. The editor
    is ordinary Rails: views, components, and Ruby hooks you can extend the same way
    as the rest of your application.'
  changes:
  - kind: feature
    text: 'Editor stack: Hotwire, ViewComponent, Tailwind CSS 4, and importmap-rails
      — same class of UX as before, without Vue in production'
  - kind: feature
    text: Rails 7.2 and 8.x tested and supported
  - kind: chore
    text: Ruby 3.2+ compatibility improvements (gem still requires Ruby >= 3.0)
  - kind: feature
    text: MariaDB / MySQL support alongside Postgres and SQLite
  - kind: feature
    text: Stronger Propshaft-style setups; editor Tailwind can include content paths
      from the host app so host classes compile correctly
  - kind: feature
    text: UIKit preview with Lookbook (uikit.maglev.dev)
  - kind: chore
    text: Removed the legacy REST API and old admin web routes tied to the previous
      editor approach
  - kind: chore
    text: Dropped Vite / vite-rails, Kaminari, JBuilder, and Node-based editor assets
      for the new direction
  - kind: chore
    text: No separate Maglev admin section — editing flows live in the new editor
  - kind: feature
    text: Revamped add-section flow; UI polish (pages list, navigation, publish notifications,
      locale switcher hidden for a single locale, draft/live preview links)
  - kind: feature
    text: Paginated pages list with path column; configurable per_page for assets
      pagination
  - kind: feature
    text: Sidebar, top bar, and view consistency pass
  - kind: feature
    text: 'Draft vs published: publish, discard draft, revert changes, publish page
      metadata (title + SEO), CLI to publish all pages for a site (with guards when
      no site exists)'
  - kind: feature
    text: Publishing status indicators; CreatePageService improvements for paths across
      locales; fixes for duplicate sections on new pages and published pages with
      no sections
  - kind: feature
    text: Global event when a page is updated (for host-app hooks)
  - kind: feature
    text: Engine routes split into smaller chunks
  - kind: feature
    text: External JS namespaced under maglev/; editor client JS scoped to the iframe
      as intended
